[project]
name = "stella"
version = "0.1.0"
description = "Automatic Nikon D60 configuration for astrophotography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gphoto2"]

[project.scripts]
stella = "stella.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stella"]

