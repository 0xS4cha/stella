[project]
name = "stella"
version = "0.1.0"
description = "Automatic Nikon D60 configuration for astrophotography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "exifread>=3.5.1",
    "gphoto2",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "platformdirs>=4.12.4",
    "rawpy>=0.27.1",
    "sep>=1.4.1",
    "skyfield>=1.55",
]

[project.scripts]
stella = "stella.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stella"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
